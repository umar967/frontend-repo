<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAB TASK APP</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      padding: 30px 40px;
      border-radius: 16px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 600px;
      text-align: center;
    }

    h1 {
      color: #333;
      margin-bottom: 25px;
      font-size: 28px;
    }

    textarea {
      width: 100%;
      height: 220px;
      padding: 15px;
      border: 2px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      resize: vertical;
      outline: none;
      transition: border-color 0.3s;
    }

    textarea:focus {
      border-color: #667eea;
    }

    .buttons {
      margin-top: 20px;
      display: flex;
      gap: 15px;
      justify-content: center;
    }

    button {
      padding: 12px 30px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      color: white;
    }

    #enterBtn {
      background-color: #667eea;
    }

    #enterBtn:hover {
      background-color: #5a6fd8;
      transform: translateY(-2px);
    }

    #listBtn {
      background-color: #48bb78;
    }

    #listBtn:hover {
      background-color: #38a169;
      transform: translateY(-2px);
    }

    .status {
      margin-top: 15px;
      font-size: 14px;
      color: #666;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📝 Lab Task Logger</h1>

    <textarea id="textBox" placeholder="Type something here..."></textarea>

    <div class="buttons">
      <button id="enterBtn" onclick="sendData()">Enter</button>
      <button id="listBtn" onclick="fetchData()">List</button>
    </div>

    <div class="status" id="status"></div>
  </div>

  <script>
    // ✅ CORRECT: Use relative path - Nginx will proxy to backend
    const API_BASE = '/api';

    async function sendData() {
      const textBox = document.getElementById("textBox");
      const status = document.getElementById("status");
      const text = textBox.value.trim();

      if (!text) {
        status.textContent = "Please enter some text first!";
        status.style.color = "red";
        return;
      }

      status.textContent = "Saving...";
      status.style.color = "#667eea";

      try {
        const response = await fetch(`${API_BASE}/enter`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ input_text: text })
        });

        const data = await response.json();

        if (response.ok) {
          textBox.value = "";
          status.textContent = "✅ Saved successfully!";
          status.style.color = "green";
        } else {
          status.textContent = data.error || "Failed to save";
          status.style.color = "red";
        }
      } catch (err) {
        status.textContent = "❌ Error connecting to backend";
        status.style.color = "red";
        console.error('Error:', err);
      }
    }

    async function fetchData() {
      const textBox = document.getElementById("textBox");
      const status = document.getElementById("status");

      status.textContent = "Loading...";
      status.style.color = "#667eea";

      try {
        const response = await fetch(`${API_BASE}/list`);
        const data = await response.json();

        if (response.ok) {
          textBox.value = data.logs || "No entries found";
          status.textContent = "✅ Entries loaded!";
          status.style.color = "green";
        } else {
          status.textContent = data.error || "Failed to load";
          status.style.color = "red";
        }
      } catch (err) {
        status.textContent = "❌ Error connecting to backend";
        status.style.color = "red";
        console.error('Error:', err);
      }
    }
  </script>
</body>
</html>
